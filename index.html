<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy's Pisonet Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Press Start 2P', cursive; }
        .pixel-shadow { box-shadow: 4px 4px 0px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-[#3b5bdb] min-h-screen flex flex-col items-center justify-center p-4">

    <div class="text-center mb-6 w-full">
        <p class="text-white text-[10px] mb-3 tracking-widest opacity-80 uppercase">Ivy's Pisonet</p>
        <div class="bg-red-600 border-4 border-yellow-400 rounded-full py-3 px-6 shadow-xl inline-block transform -rotate-1">
            <h1 class="text-white text-xs md:text-lg italic font-bold">ROBLOX GIVE-AWAY</h1>
        </div>
    </div>

    <div class="bg-[#1c92ff] w-full max-w-md md:max-w-lg rounded-2xl p-5 md:p-8 border-b-8 border-black/20 shadow-2xl">
        <h2 class="text-white text-center text-xl mb-8 tracking-tighter">LEADERBOARD</h2>

        <div id="leaderboard-list" class="space-y-4">
            </div>
    </div>
<script>
    const SUPABASE_URL = 'https://avkwuvnshxkhpxfgyrqy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ZcLXk3Eqmu1ramk5sbbQoQ_wKWmaQb-';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function fetchLeaderboard() {
        const { data, error } = await supabaseClient
            .from('leaderboard')
            .select('*')
            // This ensures the person with the most Robux is Rank 1
            .order('robux', { ascending: false }); 

        if (error) return console.error(error);

        const container = document.getElementById('leaderboard-list');
        
        // Using index + 1 ensures ranks 1, 2, 3 show up instead of "null"
        container.innerHTML = data.map((player, index) => `
            <div class="bg-[#005fb8] flex items-center p-3 rounded-lg pixel-shadow border border-white/10 mb-4">
                <div class="flex-shrink-0 w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center text-[10px] text-black font-bold mr-3 ring-2 ring-yellow-200">
                    ${index + 1}
                </div>
                
                <div class="w-10 h-10 bg-gray-400 rounded-full mr-4 border-2 border-white/20 overflow-hidden flex-shrink-0">
                    <img src="${player.photo_url || 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + player.name}" 
                         alt="avatar" class="w-full h-full object-cover">
                </div>

                <span class="text-white text-[10px] md:text-sm flex-grow truncate uppercase mr-2">${player.name}</span>
                
                <div class="flex items-center bg-[#004a8f] px-3 py-2 rounded-md flex-shrink-0">
                    <div class="w-4 h-4 bg-yellow-400 rounded-full mr-2 border-b-2 border-yellow-600"></div>
                    <span class="text-white text-[9px] md:text-[10px]">${player.robux} ROBUX</span>
                </div>
            </div>
        `).join('');
    }

    // Initial load
    fetchLeaderboard();

    // Realtime sync: Updates the site immediately when you change Supabase
    supabaseClient
        .channel('any')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'leaderboard' }, fetchLeaderboard)
        .subscribe();
</script>
</body>
</html>
